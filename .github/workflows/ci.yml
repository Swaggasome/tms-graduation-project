name: CI

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML manifests
        run: |
          kubectl kustomize k8s/overlays/staging > /tmp/staging.yaml
          kubectl kustomize k8s/overlays/production > /tmp/production.yaml
