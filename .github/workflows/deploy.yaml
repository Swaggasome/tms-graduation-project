name: Deploy to Yandex Cloud Kubernetes

on:
  push:
    branches: 
      - main
      - staging
      - 'feature/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            ENVIRONMENT="production"
            NAMESPACE="smartmeeting-prod"
            OVERLAY="production"
            REPLICAS_WEB=3
            REPLICAS_WORKER=2
          elif [[ "${{ github.ref_name }}" == "staging" ]]; then
            ENVIRONMENT="staging"
            NAMESPACE="smartmeeting-staging"
            OVERLAY="staging"
            REPLICAS_WEB=2
            REPLICAS_WORKER=1
          elif [[ "${{ github.ref_name }}" == feature/* ]]; then
            ENVIRONMENT="feature"
            BRANCH_NAME="${{ github.ref_name }}"
            NAMESPACE="feature-${BRANCH_NAME#feature/}"
            NAMESPACE=$(echo "$NAMESPACE" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
            OVERLAY="feature"
            REPLICAS_WEB=1
            REPLICAS_WORKER=1
          fi
          
          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "NAMESPACE=$NAMESPACE" >> $GITHUB_OUTPUT
          echo "OVERLAY=$OVERLAY" >> $GITHUB_OUTPUT
          echo "REPLICAS_WEB=$REPLICAS_WEB" >> $GITHUB_OUTPUT
          echo "REPLICAS_WORKER=$REPLICAS_WORKER" >> $GITHUB_OUTPUT
          
          echo "Environment: $ENVIRONMENT"
          echo "Namespace: $NAMESPACE"
          echo "Overlay: $OVERLAY"

      - name: Login to Yandex CR
        uses: yc-actions/yc-cr-login@v1
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build, tag, and push image
        env:
          CR_REGISTRY: ${{ secrets.CR_REGISTRY_ID }}
          CR_REPOSITORY: ${{ secrets.CR_REPOSITORY }}
          ENVIRONMENT: ${{ steps.env.outputs.ENVIRONMENT }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [[ "$ENVIRONMENT" == "feature" ]]; then
            IMAGE_TAG="${{ github.sha }}-feature"
          elif [[ "$ENVIRONMENT" == "staging" ]]; then
            IMAGE_TAG="staging-latest"
          else
            IMAGE_TAG="latest"
          fi
          
          docker build -t cr.yandex/$CR_REGISTRY/$CR_REPOSITORY:$IMAGE_TAG .
          docker push cr.yandex/$CR_REGISTRY/$CR_REPOSITORY:$IMAGE_TAG

      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authenticate yc CLI
        run: |
          cat > /tmp/sa-key.json << 'EOF'
          ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          EOF
          
          yc config set service-account-key /tmp/sa-key.json
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}

      - name: Get Kubernetes cluster credentials
        run: |
          yc managed-kubernetes cluster get-credentials ${{ secrets.YC_K8S_CLUSTER_NAME }} \
            --folder-id ${{ secrets.YC_FOLDER_ID }} \
            --external

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ steps.env.outputs.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create .env.secret from GitHub Secrets
        run: |
          if [[ "${{ steps.env.outputs.ENVIRONMENT }}" == "production" ]]; then
            DB_USER="${{ secrets.PROD_DB_USER }}"
            DB_PASSWORD="${{ secrets.PROD_DB_PASSWORD }}"
            DB_DATABASE="${{ secrets.PROD_DB_DATABASE }}"
            DJANGO_SECRET_KEY="${{ secrets.PROD_DJANGO_SECRET_KEY }}"
          else
            DB_USER="${{ secrets.STAGING_DB_USER }}"
            DB_PASSWORD="${{ secrets.STAGING_DB_PASSWORD }}"
            DJANGO_SECRET_KEY="${{ secrets.STAGING_DJANGO_SECRET_KEY }}"
            
            if [[ "${{ steps.env.outputs.ENVIRONMENT }}" == "feature" ]]; then
              DB_DATABASE="${{ secrets.STAGING_DB_DATABASE }}_feature_${{ github.sha }}"
            else
              DB_DATABASE="${{ secrets.STAGING_DB_DATABASE }}"
            fi
          fi
          
          cat > k8s/${{ steps.env.outputs.ENVIRONMENT }}/.env.secret << EOF
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          DB_DATABASE=${DB_DATABASE}
          DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
          EOF

      - name: Deploy to Kubernetes
        env:
          NAMESPACE: ${{ steps.env.outputs.NAMESPACE }}
          OVERLAY: ${{ steps.env.outputs.OVERLAY }}
          ENVIRONMENT: ${{ steps.env.outputs.ENVIRONMENT }}
        run: |
          if [[ "$ENVIRONMENT" == "feature" ]]; then
            # Для feature веток создаем временный kustomization
            mkdir -p k8s/overlays/temp
            cp k8s/overlays/feature/kustomization.yaml k8s/overlays/temp/
            cp k8s/overlays/feature/configmap-patch.yaml k8s/overlays/temp/
            
            # Заменяем плейсхолдеры
            sed -i "s/FEATURE_NAMESPACE/${NAMESPACE}/g" k8s/overlays/temp/kustomization.yaml
            sed -i "s/FEATURE_TAG/${{ github.sha }}-feature/g" k8s/overlays/temp/kustomization.yaml
            
            kubectl apply -k k8s/overlays/temp
            rm -rf k8s/overlays/temp
          else
            kubectl apply -k k8s/overlays/${OVERLAY}
          fi
          
          # Restart deployments
          kubectl rollout restart deployment/web -n ${NAMESPACE}
          kubectl rollout restart deployment/celery-worker -n ${NAMESPACE}
          kubectl rollout restart deployment/celery-beat -n ${NAMESPACE}
          
          # Wait for rollouts
          kubectl rollout status deployment/web -n ${NAMESPACE} --timeout=180s
          kubectl rollout status deployment/celery-worker -n ${NAMESPACE} --timeout=180s
          kubectl rollout status deployment/celery-beat -n ${NAMESPACE} --timeout=180s
