name: Deploy to Yandex Cloud Kubernetes

on:
  push:
    branches: [main, staging, 'feature/**']
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "ENVIRONMENT=production" >> $GITHUB_OUTPUT
            echo "NAMESPACE=smartmeeting-prod" >> $GITHUB_OUTPUT
            echo "OVERLAY=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "staging" ]]; then
            echo "ENVIRONMENT=staging" >> $GITHUB_OUTPUT
            echo "NAMESPACE=smartmeeting-staging" >> $GITHUB_OUTPUT
            echo "OVERLAY=staging" >> $GITHUB_OUTPUT
          else
            echo "ENVIRONMENT=feature" >> $GITHUB_OUTPUT
            BRANCH_NAME="${{ github.ref_name }}"
            BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/feature\///' | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
            echo "NAMESPACE=feature-${BRANCH_NAME}" >> $GITHUB_OUTPUT
            echo "OVERLAY=feature" >> $GITHUB_OUTPUT
          fi
          
          echo "Environment: ${{ steps.env.outputs.ENVIRONMENT }}"
          echo "Namespace: ${{ steps.env.outputs.NAMESPACE }}"
          echo "Overlay: ${{ steps.env.outputs.OVERLAY }}"

      - name: Login to Yandex CR
        uses: yc-actions/yc-cr-login@v1
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build, tag, and push image
        env:
          CR_REGISTRY: ${{ secrets.CR_REGISTRY_ID }}
          CR_REPOSITORY: ${{ secrets.CR_REPOSITORY }}
          ENVIRONMENT: ${{ steps.env.outputs.ENVIRONMENT }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$ENVIRONMENT" == "production" ]]; then
            TAG="latest"
          elif [[ "$ENVIRONMENT" == "staging" ]]; then
            TAG="staging-latest"
          else
            TAG="${SHA}-feature"
          fi
          
          echo "Building image with tag: $TAG"
          docker build -t cr.yandex/$CR_REGISTRY/$CR_REPOSITORY:$TAG .
          docker push cr.yandex/$CR_REGISTRY/$CR_REPOSITORY:$TAG
          
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Authenticate yc CLI
        run: |
          echo '${{ secrets.YC_SA_JSON_CREDENTIALS }}' > /tmp/sa-key.json
          
          yc config set service-account-key /tmp/sa-key.json
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}

      - name: Get Kubernetes cluster credentials
        run: |
          yc managed-kubernetes cluster get-credentials ${{ secrets.YC_K8S_CLUSTER_NAME }} \
            --folder-id ${{ secrets.YC_FOLDER_ID }} \
            --external

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ steps.env.outputs.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create .env.secret from GitHub Secrets
        env:
          ENVIRONMENT: ${{ steps.env.outputs.ENVIRONMENT }}
        run: |
          mkdir -p k8s/secrets

          if [[ "$ENVIRONMENT" == "production" ]]; then
            echo "Creating .env.secret for PRODUCTION"

            {
              echo "DB_USER=${{ secrets.PROD_DB_USER }}"
              echo "DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}"
              echo "DB_DATABASE=${{ secrets.PROD_DB_DATABASE }}"
              echo "DJANGO_SECRET_KEY=${{ secrets.PROD_DJANGO_SECRET_KEY }}"
            } > k8s/secrets/.env.secret

          elif [[ "$ENVIRONMENT" == "staging" ]]; then
            echo "Creating .env.secret for STAGING"

            {
              echo "DB_USER=${{ secrets.STAGING_DB_USER }}"
              echo "DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}"
              echo "DB_DATABASE=${{ secrets.STAGING_DB_DATABASE }}"
              echo "DJANGO_SECRET_KEY=${{ secrets.STAGING_DJANGO_SECRET_KEY }}"
            } > k8s/secrets/.env.secret

          else
            echo "Creating .env.secret for FEATURE branch"

            FEATURE_DB_NAME="${{ secrets.STAGING_DB_DATABASE }}_feature_${{ github.sha }}"
            FEATURE_DB_NAME=$(echo "$FEATURE_DB_NAME" | cut -c1-63)

            {
              echo "DB_USER=${{ secrets.STAGING_DB_USER }}"
              echo "DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}"
              echo "DB_DATABASE=${FEATURE_DB_NAME}"
              echo "DJANGO_SECRET_KEY=${{ secrets.STAGING_DJANGO_SECRET_KEY }}"
            } > k8s/secrets/.env.secret
          fi

          if [ -f k8s/secrets/.env.secret ]; then
            echo "✅ .env.secret created successfully"
            echo "Variables present:"
            grep -o '^[^=]*' k8s/secrets/.env.secret
          else
            echo "❌ Failed to create .env.secret"
            exit 1
          fi

      - name: Deploy to Kubernetes
        env:
          NAMESPACE: ${{ steps.env.outputs.NAMESPACE }}
          ENVIRONMENT: ${{ steps.env.outputs.ENVIRONMENT }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          CR_REGISTRY: ${{ secrets.CR_REGISTRY_ID }}
          CR_REPOSITORY: ${{ secrets.CR_REPOSITORY }}
        run: |
          if [[ "$ENVIRONMENT" == "feature" ]]; then
            echo "Deploying FEATURE branch to namespace: $NAMESPACE"
            
            mkdir -p k8s/overlays/temp
            
            # Создаем kustomization.yaml без heredoc проблем
            cat > k8s/overlays/temp/kustomization.yaml <<KUSTOMIZATION_EOF
            apiVersion: kustomize.config.k8s.io/v1beta1
            kind: Kustomization
            
            resources:
              - ../../base
            
            namespace: ${NAMESPACE}
            
            secretGenerator:
            - name: secrets-project
              envs:
              - ../../secrets/.env.secret
              type: Opaque
              options:
                disableNameSuffixHash: true
            
            images:
            - name: cr.yandex/${CR_REGISTRY}/${CR_REPOSITORY}
              newTag: ${IMAGE_TAG}
            
            patches:
            - target:
                kind: Deployment
                name: web
              patch: |-
                - op: replace
                  path: /spec/replicas
                  value: 1
            - target:
                kind: Deployment
                name: celery-worker
              patch: |-
                - op: replace
                  path: /spec/replicas
                  value: 1
            - target:
                kind: ConfigMap
                name: smartmeeting-config
              patch: |-
                - op: replace
                  path: /data/DJANGO_DEBUG
                  value: "True"
                - op: replace
                  path: /data/DJANGO_ALLOWED_HOSTS
                  value: "*"
            KUSTOMIZATION_EOF
            
            kubectl apply -k k8s/overlays/temp
            rm -rf k8s/overlays/temp
            
          else
            echo "Deploying $ENVIRONMENT to namespace: $NAMESPACE"
            
            cp k8s/secrets/.env.secret k8s/overlays/${ENVIRONMENT}/.env.secret
            kubectl apply -k k8s/overlays/${ENVIRONMENT}
            rm -f k8s/overlays/${ENVIRONMENT}/.env.secret
          fi
          
          echo "Restarting deployments in namespace: $NAMESPACE"
          kubectl rollout restart deployment/web -n $NAMESPACE || true
          kubectl rollout restart deployment/celery-worker -n $NAMESPACE || true
          kubectl rollout restart deployment/celery-beat -n $NAMESPACE || true
          
          echo "Waiting for rollouts to complete..."
          kubectl rollout status deployment/web -n $NAMESPACE --timeout=180s || true
          kubectl rollout status deployment/celery-worker -n $NAMESPACE --timeout=180s || true
          kubectl rollout status deployment/celery-beat -n $NAMESPACE --timeout=180s || true
          
          echo "✅ Deployment completed for $ENVIRONMENT"

      - name: Clean up secrets
        if: always()
        run: |
          rm -rf k8s/secrets
          echo "🧹 Cleaned up temporary secret files"
