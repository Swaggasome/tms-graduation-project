name: Deploy to Yandex Cloud Kubernetes

on:
  push:
    branches:
      - main
      - staging
      - 'feature/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_NAME: cr.yandex/${{ secrets.CR_REGISTRY_ID }}/${{ secrets.CR_REPOSITORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        id: env
        shell: bash
        run: |
          BRANCH="${{ github.ref_name }}"

          if [[ "$BRANCH" == "main" ]]; then
            ENVIRONMENT="production"
            NAMESPACE="smartmeeting-prod"
            OVERLAY="production"
            APP_DOMAIN="${{ secrets.PROD_APP_DOMAIN }}"
          elif [[ "$BRANCH" == "staging" ]]; then
            ENVIRONMENT="staging"
            NAMESPACE="smartmeeting-staging"
            OVERLAY="staging"
            APP_DOMAIN="${{ secrets.STAGING_APP_DOMAIN }}"
          elif [[ "$BRANCH" =~ ^feature/ ]]; then
            ENVIRONMENT="feature"
            OVERLAY="feature"
            APP_DOMAIN="${{ secrets.STAGING_APP_DOMAIN }}"

            RAW_NAME="feature-${BRANCH#feature/}"
            NAMESPACE=$(echo "$RAW_NAME" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9-]/-/g' \
              | sed 's/^-//;s/-$//' \
              | cut -c1-63)
          else
            echo "Unsupported branch: $BRANCH"
            exit 1
          fi

          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "NAMESPACE=$NAMESPACE" >> "$GITHUB_OUTPUT"
          echo "OVERLAY=$OVERLAY" >> "$GITHUB_OUTPUT"
          echo "APP_DOMAIN=$APP_DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v1
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build and push image
        run: |
          docker build -t "$IMAGE_NAME:$IMAGE_TAG" .
          docker push "$IMAGE_NAME:$IMAGE_TAG"

      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Authenticate yc CLI
        run: |
          echo '${{ secrets.YC_SA_JSON_CREDENTIALS }}' > /tmp/sa-key.json
          yc config set service-account-key /tmp/sa-key.json
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          yc config set cloud-id ${{ secrets.YC_CLOUD_ID }}

      - name: Get Kubernetes credentials
        run: |
          yc managed-kubernetes cluster get-credentials \
            ${{ secrets.YC_K8S_CLUSTER_ID }} \
            --folder-id ${{ secrets.YC_FOLDER_ID }} \
            --external

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Install cluster prerequisites
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.19.5/cert-manager.yaml
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.1/deploy/static/provider/cloud/deploy.yaml

      - name: Apply cluster configuration
        env:
          CERT_MANAGER_EMAIL: ${{ secrets.CERT_MANAGER_EMAIL }}
        run: |
          if [[ -z "$CERT_MANAGER_EMAIL" ]]; then
            echo "CERT_MANAGER_EMAIL secret is required"
            exit 1
          fi

          cp -r k8s/cluster /tmp/k8s-cluster
          envsubst < k8s/cluster/cluster-issuers.yaml > /tmp/k8s-cluster/cluster-issuers.yaml
          kubectl apply -k /tmp/k8s-cluster

      - name: Create namespace
        run: |
          kubectl create namespace "${{ steps.env.outputs.NAMESPACE }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create .env.secret
        shell: bash
        run: |
          if [[ "${{ steps.env.outputs.ENVIRONMENT }}" == "production" ]]; then
            DB_USER="${{ secrets.PROD_DB_USER }}"
            DB_PASSWORD="${{ secrets.PROD_DB_PASSWORD }}"
            DB_DATABASE="${{ secrets.PROD_DB_DATABASE }}"
            DJANGO_SECRET_KEY="${{ secrets.PROD_DJANGO_SECRET_KEY }}"
            EMAIL_HOST_USER="${{ secrets.EMAIL_HOST_USER }}"
            EMAIL_HOST_PASSWORD="${{ secrets.EMAIL_HOST_PASSWORD }}"
            DEFAULT_FROM_EMAIL="${{ secrets.DEFAULT_FROM_EMAIL }}"
            YC_STORAGE_BUCKET_NAME="${{ secrets.YC_STORAGE_BUCKET_NAME }}"
            YC_STORAGE_ACCESS_KEY="${{ secrets.YC_STORAGE_ACCESS_KEY }}"
            YC_STORAGE_SECRET_KEY="${{ secrets.YC_STORAGE_SECRET_KEY }}"
            USE_S3_STATIC="${{ secrets.USE_S3_STATIC }}"
          else
            DB_USER="${{ secrets.STAGING_DB_USER }}"
            DB_PASSWORD="${{ secrets.STAGING_DB_PASSWORD }}"
            DJANGO_SECRET_KEY="${{ secrets.STAGING_DJANGO_SECRET_KEY }}"
            EMAIL_HOST_USER="${{ secrets.EMAIL_HOST_USER }}"
            EMAIL_HOST_PASSWORD="${{ secrets.EMAIL_HOST_PASSWORD }}"
            DEFAULT_FROM_EMAIL="${{ secrets.DEFAULT_FROM_EMAIL }}"
            YC_STORAGE_BUCKET_NAME="${{ secrets.YC_STORAGE_BUCKET_NAME }}"
            YC_STORAGE_ACCESS_KEY="${{ secrets.YC_STORAGE_ACCESS_KEY }}"
            YC_STORAGE_SECRET_KEY="${{ secrets.YC_STORAGE_SECRET_KEY }}"
            USE_S3_STATIC="${{ secrets.USE_S3_STATIC }}"
            if [[ "${{ steps.env.outputs.ENVIRONMENT }}" == "feature" ]]; then
              SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
              DB_DATABASE="${{ secrets.STAGING_DB_DATABASE }}"
              USE_S3_STATIC="${{ secrets.USE_S3_STATIC }}"
            else
              DB_DATABASE="${{ secrets.STAGING_DB_DATABASE }}"
            fi
          fi

          cat > k8s/base/.env.secret <<EOF
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          DB_DATABASE=${DB_DATABASE}
          DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
          EMAIL_HOST_USER=${EMAIL_HOST_USER}
          EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
          DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
          YC_STORAGE_BUCKET_NAME=${YC_STORAGE_BUCKET_NAME}
          YC_STORAGE_ACCESS_KEY=${YC_STORAGE_ACCESS_KEY}
          YC_STORAGE_SECRET_KEY=${YC_STORAGE_SECRET_KEY}
          USE_S3_STATIC=${USE_S3_STATIC}
          EOF

      - name: Prepare kustomize overlay
        shell: bash
        run: |
          OVERLAY="${{ steps.env.outputs.OVERLAY }}"
          NAMESPACE="${{ steps.env.outputs.NAMESPACE }}"

          if [[ "$OVERLAY" == "feature" ]]; then
            mkdir -p k8s/overlays/temp
            cp -r k8s/overlays/feature/* k8s/overlays/temp/
            OVERLAY_PATH="k8s/overlays/temp"
          else
            OVERLAY_PATH="k8s/overlays/$OVERLAY"
          fi

          export APP_DOMAIN="${{ steps.env.outputs.APP_DOMAIN }}"

          if [[ -z "$APP_DOMAIN" ]]; then
            echo "APP_DOMAIN is required"
            exit 1
          fi

          for file in "$OVERLAY_PATH"/ingress-patch.yaml "$OVERLAY_PATH"/configmap-patch.yaml; do
            if [[ -f "$file" ]]; then
              envsubst < "$file" > "$file.tmp"
              mv "$file.tmp" "$file"
            fi
          done

          cd "$OVERLAY_PATH"

          kustomize edit set namespace "$NAMESPACE"
          kustomize edit set image smartmeeting-app="$IMAGE_NAME:$IMAGE_TAG"

          echo "OVERLAY_PATH=$OVERLAY_PATH" >> "$GITHUB_ENV"

      - name: Validate manifests
        run: |
          kubectl apply --dry-run=client -k "$OVERLAY_PATH"

      - name: Run Django setup commands
        env:
          NAMESPACE: ${{ steps.env.outputs.NAMESPACE }}
        shell: bash
        run: |
          set -euo pipefail

          run_job() {
            JOB_NAME="$1"
            COMMAND="$2"

            echo "Running job: ${JOB_NAME}"

            kubectl delete job "${JOB_NAME}" \
              -n "${NAMESPACE}" \
              --ignore-not-found=true

            cat > /tmp/job.yaml <<EOF
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${NAMESPACE}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: ${JOB_NAME}
          image: ${IMAGE_NAME}:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "${COMMAND}"]
          envFrom:
            - configMapRef:
                name: smartmeeting-config
            - secretRef:
                name: secrets-project
EOF

            kubectl apply -f /tmp/job.yaml

            kubectl wait \
              --for=condition=complete \
              job/"${JOB_NAME}" \
              -n "${NAMESPACE}" \
              --timeout=300s || {
                echo "Job failed: ${JOB_NAME}"
                kubectl logs job/"${JOB_NAME}" -n "${NAMESPACE}" --all-containers=true || true
                kubectl describe job/"${JOB_NAME}" -n "${NAMESPACE}" || true
                exit 1
              }

            kubectl logs job/"${JOB_NAME}" \
              -n "${NAMESPACE}" \
              --all-containers=true || true
          }

          run_job django-migrate "python manage.py migrate"
          run_job django-create-rooms "python manage.py create_rooms"
          run_job django-reminder-schedule "python manage.py setup_reminder_schedule"
          run_job django-collectstatic "python manage.py collectstatic --noinput"

      - name: Deploy and rollback on failure
        env:
          NAMESPACE: ${{ steps.env.outputs.NAMESPACE }}
        shell: bash
        run: |
          set -e

          DEPLOYMENTS=("web" "celery-worker" "celery-beat")

          echo "Applying manifests..."
          kubectl apply -k "$OVERLAY_PATH"

          echo "Annotating deployments..."
          for deploy in "${DEPLOYMENTS[@]}"; do
            kubectl annotate deployment/"$deploy" \
              kubernetes.io/change-cause="Deploy image $IMAGE_NAME:$IMAGE_TAG from commit $GITHUB_SHA" \
              -n "$NAMESPACE" --overwrite || true
          done

          failed=0

          for deploy in "${DEPLOYMENTS[@]}"; do
            echo "Waiting for deployment/$deploy..."

            if ! kubectl rollout status deployment/"$deploy" -n "$NAMESPACE" --timeout=300s; then
              echo "Deployment failed: $deploy"
              failed=1
            fi
          done

          if [[ "$failed" -eq 1 ]]; then
            echo "Deployment failed. Starting rollback..."

            for deploy in "${DEPLOYMENTS[@]}"; do
              echo "Rolling back deployment/$deploy..."
              kubectl rollout undo deployment/"$deploy" -n "$NAMESPACE" || true
            done

            echo "Waiting for rollback..."

            for deploy in "${DEPLOYMENTS[@]}"; do
              kubectl rollout status deployment/"$deploy" -n "$NAMESPACE" --timeout=300s || true
            done

            echo "Pods after rollback:"
            kubectl get pods -n "$NAMESPACE" -o wide

            echo "Deployment history:"
            for deploy in "${DEPLOYMENTS[@]}"; do
              echo "History for deployment/$deploy:"
              kubectl rollout history deployment/"$deploy" -n "$NAMESPACE" || true
            done

            echo "Recent events:"
            kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp | tail -n 50

            exit 1
          fi

          echo "Deployment completed successfully"

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/sa-key.json
          rm -f /tmp/job.yaml
          rm -f k8s/base/.env.secret
          rm -rf k8s/overlays/temp
          rm -rf /tmp/k8s-cluster
