grafana:
  enabled: true
  adminPassword: "CHANGE_ME"

  service:
    type: ClusterIP

prometheus:
  prometheusSpec:
    retention: 3d

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}

alertmanager:
  enabled: true

  alertmanagerSpec:
    secrets:
      - telegram-alerts

  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: telegram
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    receivers:
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/telegram-alerts/bot-token
            chat_id: -1003817015965
            parse_mode: HTML
            send_resolved: true
            message: |
              {{ range .Alerts }}
              {{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }}
              <b>{{ .Status | toUpper }}</b>: <b>{{ .Labels.alertname }}</b>

              <b>Namespace:</b> {{ .Labels.namespace }}
              <b>Severity:</b> {{ .Labels.severity }}

              <b>Summary:</b> {{ .Annotations.summary }}
              <b>Description:</b> {{ .Annotations.description }}
              {{ end }}

    inhibit_rules: []
    templates: []

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeControllerManager:
  enabled: false

  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
