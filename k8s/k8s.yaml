apiVersion: v1
kind: Namespace
metadata:
  name: smartmeeting

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smartmeeting-config
  namespace: smartmeeting
data:
  DB_NAME: "smartmeeting"
  DB_USER: "postgres"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  REDIS_URL: "redis://redis:6379/0"
  DJANGO_SETTINGS_MODULE: "smartmeeting.settings"
  PYTHONUNBUFFERED: "1"
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "smartmeeting.galkin.online,smartmeeting.galkin.online"
  EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"

---
# Используем stringData вместо data
apiVersion: v1
kind: Secret
metadata:
  name: django-secret
  namespace: smartmeeting
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "django-insecure-9!v&3q@5x#2m$7k8l9p0o1i2u3y4t5r6e7w8q9z0x1c2v3b4n5m6"
  DB_PASSWORD: "postgres"

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: smartmeeting
type: Opaque
stringData:
  postgres-password: "postgres"
  postgres-user: "postgres"
  postgres-db: "smartmeeting"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: smartmeeting
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: smartmeeting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-db
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"   # PostgreSQL может потреблять больше при загрузке
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - smartmeeting
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - smartmeeting
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: smartmeeting
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: smartmeeting
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # Add storage class if needed for your cluster
  # storageClassName: standard
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: smartmeeting
type: Opaque
data: {}
  # Encode password in base64: echo -n "your_password" | base64
  # redis-password: <base64-encoded-password>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: smartmeeting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command: ["redis-server"]
        args:
        - "--bind"
        - "0.0.0.0"
        - "--protected-mode"
        - "no"
        # Uncomment to require password (use secret)
        # - "--requirepass"
        # - "$(REDIS_PASSWORD)"
        volumeMounts:
        - name: redis-storage
          mountPath: /data
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001  # Redis user in official image
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-pvc
      # Add node selector/affinity if needed
      # nodeSelector:
      #   disktype: ssd
      securityContext:
        fsGroup: 1001  # Redis group
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: smartmeeting
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  # Optional: Use ClusterIP, NodePort, or LoadBalancer based on needs
  # type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: smartmeeting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      initContainers:
      - name: run-migrations
        image: cr.yandex/crpf4khvh0ohsei6g2an/smartmeeting:latest
        imagePullPolicy: Always
        command: ['python', 'manage.py', 'migrate']
        env:
        # Из ConfigMap
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: smartmeeting-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: smartmeeting-config
              key: DB_USER
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: smartmeeting-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: smartmeeting-config
              key: DB_PORT
        - name: DJANGO_SETTINGS_MODULE
          valueFrom:
            configMapKeyRef:
              name: smartmeeting-config
              key: DJANGO_SETTINGS_MODULE
        - name: PYTHONUNBUFFERED
          valueFrom:
            configMapKeyRef:
              name: smartmeeting-config
              key: PYTHONUNBUFFERED
        # Из Secret
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: django-secret
              key: DJANGO_SECRET_KEY
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: django-secret
              key: DB_PASSWORD
      containers:
      - name: web
        image: cr.yandex/crpf4khvh0ohsei6g2an/smartmeeting:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        command: ["python", "manage.py"]
        args: ["runserver", "0.0.0.0:8000"]
        env:
        # Из ConfigMap
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: smartmeeting-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: smartmeeting-config
              key: DB_USER
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: smartmeeting-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: smartmeeting-config
              key: DB_PORT
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: smartmeeting-config
              key: REDIS_URL
        - name: DJANGO_SETTINGS_MODULE
          valueFrom:
            configMapKeyRef:
              name: smartmeeting-config
              key: DJANGO_SETTINGS_MODULE
        - name: PYTHONUNBUFFERED
          valueFrom:
            configMapKeyRef:
              name: smartmeeting-config
              key: PYTHONUNBUFFERED
        - name: DJANGO_DEBUG
          valueFrom:
            configMapKeyRef:
              name: smartmeeting-config
              key: DJANGO_DEBUG
        - name: DJANGO_ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: smartmeeting-config
              key: DJANGO_ALLOWED_HOSTS
        # Из Secret
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: django-secret
              key: DJANGO_SECRET_KEY
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: django-secret
              key: DB_PASSWORD
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
            httpHeaders:
            - name: Host
              value: smartmeeting.galkin.online
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
            httpHeaders:
            - name: Host
              value: smartmeeting.galkin.online
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: smartmeeting
spec:
  selector:
    app: web
  ports:
  - port: 8000
    targetPort: 8000
  type: LoadBalancer  # Или NodePort
---
