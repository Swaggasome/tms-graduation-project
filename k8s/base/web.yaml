apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      component: web
  template:
    metadata:
      labels:
        component: web
    spec:
      containers:
        - name: web
          image: cr.yandex/crp4hm8njs66k72arusc/smartmeeting:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          command: ["gunicorn"]
          args:
            - "smartmeeting.wsgi:application"
            - "--bind"
            - "0.0.0.0:8000"
            - "--workers"
            - "3"
          envFrom:
            - configMapRef:
                name: smartmeeting-config
            - secretRef:
                name: secrets-project
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: smartmeeting
    component: web
spec:
  selector:
    component: web
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
