apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
spec:
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
  replicas: 1
  selector:
    matchLabels:
      component: celery-worker
  template:
    metadata:
      labels:
        component: celery-worker
    spec:
      containers:
        - name: celery
          image: smartmeeting-app
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "smartmeeting", "worker", "-l", "info"]
          envFrom:
            - configMapRef:
                name: smartmeeting-config
            - secretRef:
                name: secrets-project
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "300m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
spec:
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
  replicas: 1
  selector:
    matchLabels:
      component: celery-beat
  template:
    metadata:
      labels:
        component: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: smartmeeting-app
          imagePullPolicy: IfNotPresent
          command:
            - "celery"
            - "-A"
            - "smartmeeting"
            - "beat"
            - "-l"
            - "info"
            - "--scheduler"
            - "django_celery_beat.schedulers:DatabaseScheduler"
          envFrom:
            - configMapRef:
                name: smartmeeting-config
            - secretRef:
                name: secrets-project
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
