apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- configmap.yaml
- postgres.yaml
- redis.yaml
- web.yaml
- celery.yaml
- ingress.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
- envs:
  - .env.secret
  name: secrets-project
  type: Opaque


commonAnnotations:
  organization: smartmeeting

labels:
- includeSelectors: true
  pairs:
    app: smartmeeting
    managed-by: kustomize
