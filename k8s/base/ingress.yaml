apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartmeeting-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Базовые аннотации (будут переопределены)
spec:
  rules:
  - host: placeholder.domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 8000
