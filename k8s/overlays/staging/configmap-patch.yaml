apiVersion: v1
kind: ConfigMap
metadata:
  name: smartmeeting-config
data:
  DJANGO_DEBUG: "True"
  DJANGO_ALLOWED_HOSTS: "staging.smartmeeting.galkin.online,staging.example.com"
  DJANGO_CSRF_TRUSTED_ORIGINS: "https://staging.smartmeeting.galkin.online"
  DJANGO_CSRF_COOKIE_SECURE: "False"
  DJANGO_SESSION_COOKIE_SECURE: "False"
  EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
