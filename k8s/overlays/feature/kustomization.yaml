apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

replicas:
  - name: web
    count: 1
  - name: celery-worker
    count: 1
  - name: celery-beat
    count: 1

patchesStrategicMerge:
  - configmap-patch.yaml
  - delete-ingress.yaml
  - delete-postgres.yaml
  - delete-redis.yaml
