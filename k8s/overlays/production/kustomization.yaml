apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: smartmeeting-prod

# Изменяем количество реплик
replicas:
- name: web
  count: 3
- name: celery-worker
  count: 2
- name: celery-beat
  count: 1

# Патчи для конфигурации
patchesStrategicMerge:
  - configmap-patch.yaml
  - ingress-patch.yaml

# Изменяем тип сервиса на LoadBalancer
patches:
- target:
    kind: Service
    name: web
  patch: |
    - op: replace
      path: /spec/type
      value: LoadBalancer

images:
- name: cr.yandex/crpfasovola9dqldhpk4/smartmeeting
  newTag: latest
